<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Support Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .info { margin-top: 20px; font-size: 0.9em; color: #666; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Rider Support Portal</h2>
        <p style="text-align:center;">I-submit ang iyong concern sa ibaba:</p>
        
        <form action="https://formspree.io/f/mnjrvayw" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <textarea name="message" rows="4" placeholder="Ilarawan ang iyong concern..." required></textarea>
            <button type="submit">Submit Concern</button>
        </form>

        <div class="info">
            <p><strong>Tips para sa mga Rider:</strong></p>
            <ul>
                <li>Laging mag-check ng "Heat Map" para sa peak demand.</li>
                <li>Mag-ingat sa pag-accept ng malalayong order kapag rush hour.</li>
                <li>Iwasan ang paggamit ng mga unofficial third-party apps.</li>
            </ul>
        </div>
    </div>
</body>
</html>
