<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Rider Portal</title>
    <style>
        body { font-family: sans-serif; background-color: #ffe0eb; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #e00067; text-align: center; }
        /* Panda Face Logo - Ginagamit natin ang emoji base sa request mo */
        .panda-emoji { font-size: 80px; margin-bottom: 5px; display: block; }
        .vehicle-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .icon-box { font-size: 20px; color: #e00067; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #e00067; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        h2 { color: #e00067; margin-top: 0; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <span class="panda-emoji">🐼</span>
        <div class="vehicle-icons">
            <span>🛵 RIDER</span> <span>🚲 BIKER</span> <span>🚶 WALKER</span>
        </div>
        <h2>Panda Partner Support</h2>
        <form action="https://formspree.io/f/mnjrvayw" method="POST">
            <label>Name:</label>
            <input type="text" name="name" placeholder="Full Name" required>
            <label>Rider ID:</label>
            <input type="text" name="rider_id" placeholder="Enter your ID Number" required>
            <label>Your Rider Email:</label>
            <input type="email" name="email" placeholder="email@address.com" required>
            <label>Concern:</label>
            <textarea name="concern" placeholder="Ilarawan ang iyong concern..." required rows="4"></textarea>
            <button type="submit">Submit Concern</button>
        </form>
    </div>
</body>
</html>
