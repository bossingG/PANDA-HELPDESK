<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Rider Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffe0eb; display: flex; justify-content: center; align-items: flex-start; padding: 20px; margin: 0; min-height: 100vh; }
        .container { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #e00067; margin-top: 10px; }
        
        .logo-section { text-align: center; margin-bottom: 25px; }
        .panda-logo { width: 70px; height: 70px; }
        .vehicle-icons { display: flex; justify-content: space-around; font-size: 24px; margin-top: 15px; }
        .icon-item { text-align: center; color: #555; display: flex; flex-direction: column; align-items: center; }
        .icon-label { font-size: 10px; margin-top: 4px; font-weight: 600; text-transform: uppercase; color: #e00067; }

        h2.portal-title { text-align: center; color: #e00067; margin-top: 0; margin-bottom: 25px; font-weight: 700; font-size: 1.4rem; border-bottom: 1px solid #ffb2cc; padding-bottom: 10px;}

        input, textarea { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; background-color: #fafafa; font-size: 14px; }
        input:focus, textarea:focus { border-color: #ffb2cc; outline: none; background-color: #fff; }
        
        label { font-weight: 600; color: #333; font-size: 13px; margin-left: 3px; }
        
        button { width: 100%; padding: 15px; background-color: #e00067; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <!-- Panda Logo -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Foodpanda_logo.svg/1200px-Foodpanda_logo.svg.png" alt="Panda Logo" class="panda-logo">
            <div class="vehicle-icons">
                <div class="icon-item">🛵 <span class="icon-label">Rider</span></div>
                <div class="icon-item">🚲 <span class="icon-label">Biker</span></div>
                <div class="icon-item">🚶 <span class="icon-label">Walker</span></div>
            </div>
        </div>

        <h2 class="portal-title">Panda Partner Support</h2>
        
        <!-- Formspree Endpoint -->
        <form action="https://formspree.io/f/mqazkdwp" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Full Name" required>

            <label for="id">ID Number:</label>
            <input type="text" id="id" name="id" placeholder="Rider/Biker/Walker ID" required>

            <label for="email">Your Rider Email:</label>
            <input type="email" id="email" name="email" placeholder="email@address.com" required>

            <label for="concern">Concern:</label>
            <textarea id="concern" name="concern" placeholder="Ilarawan ang iyong concern..." required rows="4"></textarea>

            <button type="submit">Submit Concern</button>
        </form>
    </div>
</body>
</html>
