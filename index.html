<!DOCTYPE html>
<html>
<head>
    <title>Rider Support Portal</title>
    <style>
        body { font-family: sans-serif; background-color: #fce4ec; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #d81b60; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #d81b60;">Rider Support Portal</h2>
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="rider_id" placeholder="Rider ID" required>
            <input type="email" name="email" placeholder="Your Rider Email" required>
            <textarea name="concern" placeholder="Ilarawan ang iyong concern..." required></textarea>
            <button type="submit">Submit Concern</button>
        </form>
    </div>
</body>
</html>
